{% extends "base.html" %}
{% block baslik %}İletişim — hasankk3366{% endblock %}
{% block icerik %}

<div class="card" style="max-width: 640px; margin: 0 auto;">

    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📮</div>
        <h2 style="margin-bottom: 0.5rem;">Bana Mesaj Bırak</h2>
        <p style="margin: 0;">Mesajın anında telefonuma düşer. Hepsini tek tek okuyorum.</p>
    </div>

    <form method="POST">

        <label for="isim">İsmin</label>
        <input
            type="text"
            id="isim"
            name="isim"
            value="{{ current_user.kullanici_adi }}"
            readonly
            style="opacity: 0.7; cursor: not-allowed;"
        >

        <label for="email">E-posta</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ current_user.email }}"
            readonly
            style="opacity: 0.7; cursor: not-allowed;"
        >

        <label for="mesaj">Mesajın</label>
        <textarea
            id="mesaj"
            name="mesaj"
            required
            placeholder="Ne söylemek istersin?"
            rows="6"
        ></textarea>

        <button type="submit" style="width: 100%; margin-top: 1.5rem;">
            Gönder ✈️
        </button>

    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim);">
        Giriş yaptığın hesap: <strong style="color: var(--accent2);">{{ current_user.kullanici_adi }}</strong>
    </p>

</div>

{% endblock %}
